name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest imbalanced-learn mlflow

      - name: Ejecutar tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python (necesario para DVC)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar DVC
        run: |
          pip install "pyopenssl<24.3.0" dvc dvc-gdrive
          pip show pyopenssl

      - name: Configurar credenciales de DVC
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS_DATA }}' > gdrive-credentials.json
          dvc remote modify --local gdrive_storage gdrive_use_service_account true
          dvc remote modify --local gdrive_storage gdrive_service_account_json_file_path gdrive-credentials.json

      - name: Descargar modelo con DVC
        run: dvc pull models/modelo_campeon.pkl.dvc

      - name: Construir imagen Docker
        run: docker build -t telco-churn-api .

      - name: Verificar que el contenedor arranca correctamente
        run: |
          docker run -d -p 8080:8000 --name test-container telco-churn-api
          sleep 5
          curl --fail http://localhost:8080/health || exit 1
          docker stop test-container