name: Tests

# ---- ¿Cuándo se dispara este workflow? ----
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ---- ¿Qué trabajos (jobs) va a correr? ----
jobs:
  test:
    runs-on: ubuntu-latest  # GitHub te presta una máquina virtual Linux, gratis

    steps:
      # Paso 1: descarga tu código en esa máquina virtual
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      # Paso 2: instala Python en esa máquina
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Paso 3: instala las dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install pytest  imbalanced-learn
      # Paso 4: corre los tests
      - name: Ejecutar tests
        run: pytest tests/ -v